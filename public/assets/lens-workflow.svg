<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" fill="none">
<title>From an accessibility finding to a verified fix</title>
<desc>An isometric Laravel workspace. A red scanner identifies an unnamed button in a browser, Lens traces it to Navigation.vue, and a code panel shows a proposed label. A review tray gathers fixes from three files, followed by a fresh scan.</desc>
